name: Android debug APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable Android signing key
        if: ${{ github.event_name != 'pull_request' }}
        env:
          YANDEXDOWN_KEYSTORE_BASE64: ${{ secrets.YANDEXDOWN_KEYSTORE_BASE64 }}
          YANDEXDOWN_KEYSTORE_PASSWORD: ${{ secrets.YANDEXDOWN_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$YANDEXDOWN_KEYSTORE_BASE64" ] && [ -n "$YANDEXDOWN_KEYSTORE_PASSWORD" ]; then
            echo "$YANDEXDOWN_KEYSTORE_BASE64" | base64 --decode > app/yandexdown-release.jks
            test -s app/yandexdown-release.jks
          else
            echo "Stable signing secrets are not configured; using temporary debug signing."
          fi
      - name: Validate backend Python syntax
        run: python -m py_compile backend/app.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and debug APK
        env:
          YANDEXDOWN_KEYSTORE_PASSWORD: ${{ secrets.YANDEXDOWN_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YandexDown-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
